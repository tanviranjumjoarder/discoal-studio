name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds attach installers to the GitHub release

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: C compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: uv run pytest -q

  installers:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: C compiler and Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[desktop,dev]"
      - run: ./packaging/build.sh
      - name: Smoke-test the packaged app
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then X="dist/discoal Studio.app/Contents/MacOS/discoal-studio"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then X="dist/discoal-studio/discoal-studio.exe"
          else X="dist/discoal-studio/discoal-studio"; fi
          "$X" --version
          "$X" run quick_demo --out smoke --workers 2
          ls smoke/Hard | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/discoal-studio-*.dmg
            dist/discoal-studio-*.exe
            dist/discoal-studio-*.zip
            dist/discoal-studio-*.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/discoal-studio-*.dmg
            dist/discoal-studio-*.exe
            dist/discoal-studio-*.zip
            dist/discoal-studio-*.tar.gz
